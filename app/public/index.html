<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos | Loja N3</title>
  <link rel="stylesheet" href="/loja.css">
  <script src="/loja.js" defer></script>
</head>
<body>
  <header><div class="container">Loja <span>N3</span></div></header>
  <main class="container">
    <h1>Produtos</h1>
    <div class="panels">
      <section>
        <h2>Cadastrar produto</h2>
        <form id="produto">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" maxlength="100" required>
          <label for="preco">Preço (R$)</label>
          <input id="preco" name="preco" type="number" min="0" max="99999999.99" step="0.01" required>
          <button type="submit">Cadastrar</button>
        </form>
        <p id="cadastro-status" role="status"></p>
      </section>
      <section>
        <div class="list-heading">
          <h2>Produtos cadastrados</h2>
          <button id="atualizar" type="button">Atualizar lista</button>
        </div>
        <p id="lista-status" role="status"></p>
        <table hidden>
          <thead><tr><th scope="col">ID</th><th scope="col">Nome</th><th scope="col">Preço</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </main>
</body>
</html>
