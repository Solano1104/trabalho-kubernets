apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-api
  namespace: n3-solano
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: loja-api
  template:
    metadata:
      labels:
        app: loja-api
    spec:
      containers:
        - name: loja-api
          image: loja-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: loja-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loja-secret
                  key: DB_PASSWORD
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loja-api
  namespace: n3-solano
spec:
  type: ClusterIP
  selector:
    app: loja-api
  ports:
    - port: 3000
      targetPort: 3000
